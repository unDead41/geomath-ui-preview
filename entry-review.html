<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoMath entry responsive review</title>
<style>body{margin:0;padding:20px;background:#EAF0F6;color:#18334B;font:14px system-ui}h1{font-size:18px;margin:0 0 12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}a,button{font:inherit;color:#18334B;background:white;border:1px solid #7D94A8;border-radius:8px;padding:10px;cursor:pointer}iframe{display:block;width:390px;height:940px;max-width:100%;margin:auto;background:white;border:1px solid #7D94A8;border-radius:12px}button[aria-pressed=true]{background:#215FF0;color:white}</style>
<h1>GeoMath entry responsive review</h1><nav aria-label="Viewport width"><button data-width="320" aria-pressed="false">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="1200" aria-pressed="false">1200 px</button></nav>
<nav aria-label="Entry screen"><a href="./#utama" target="entry-preview">Home</a><a href="./#main" target="entry-preview">Modes</a><a href="./#sambung" target="entry-preview">Resume</a><a href="./#cara-bermain" target="entry-preview">Guide</a></nav>
<iframe id="entry-preview" name="entry-preview" src="./#utama" title="GeoMath responsive preview"></iframe>
<script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('entry-preview').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script></html>
